allow-lan: true
unified-delay: true
tcp-concurrent: true

geox-url:
  geoip: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat'
  mmdb: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb'
  asn: 'https://raw.githubusercontent.com/xishang0128/geoip/release/GeoLite2-ASN.mmdb'

# ================= 监听器配置开始 (不需要时可将此区块整体注释) =================
# listeners:
#   - name: bili-hk
#     type: mixed
#     port: 7891
#     listen: 127.0.0.1
#     proxy: 🇭🇰 香港节点

#   - name: bili-tw
#     type: mixed
#     port: 7892
#     listen: 127.0.0.1
#     proxy: 🇹🇼 台湾节点

#   - name: bili-cn
#     type: mixed
#     port: 7893
#     listen: 127.0.0.1
#     proxy: 🇨🇳 回国节点

#   - name: bili-sg
#     type: mixed
#     port: 7894
#     listen: 127.0.0.1
#     proxy: 🇸🇬 狮城节点
# ================= 监听器配置结束 =================

# 新增：域名嗅探，防止硬编码 IP 或 fake-ip-filter 放行后的流量无法匹配域名规则
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'

dns:
  enable: true
  listen: ':1053'
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-filter-mode: 'blacklist'
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: true
  ipv6: false
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'
    - 'geosite:connectivity-check'
    - 'geosite:private'
    - 'geosite:bilibili'
    - 'pemby.ednovas.org'
  default-nameserver:
    - '223.5.5.5'
    - '119.29.29.29'
  # 节点服务器域名解析（移除 1.1.1.1，防止开启 respect-rules 后启动死锁）
  proxy-server-nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
    - 'tls://223.5.5.5'
  nameserver:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
  direct-nameserver-follow-policy: false
  direct-nameserver: []
  nameserver-policy:
    'geosite:cn,private,bilibili':
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'

