    proxies:
      - 🇺🇸 美国自动
      - DIRECT
    include-all: true
    filter: '(?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States|America|Los Angeles)\b)'

  - name: 🇸🇬 狮城节点
    type: select
    proxies:
      - 🇸🇬 狮城自动
      - DIRECT
    include-all: true
    filter: '(?i)🇸🇬|新加坡|狮城|(\b(SG|Singapore)\b)'

  - name: 🇰🇷 韩国节点
    type: select
    proxies:
      - 🇰🇷 韩国自动
      - DIRECT
    include-all: true
    filter: '(?i)🇰🇷|韩国|首尔|(\b(KR|Korea)\b)'

  - name: 🇯🇵 日本节点
    type: select
    proxies:
      - 🇯🇵 日本自动
      - DIRECT
    include-all: true
    filter: '(?i)🇯🇵|日本|东京|大阪|(\b(JP|Japan)\b)'

  - name: 🇨🇳 回国节点
    type: select
    proxies:
      - DIRECT
    include-all: true
    filter: '(?i)🇨🇳|中国|回国|国内|(\b(CN|China)\b)'
    exclude-filter: "(?i)香港|台湾|澳门|剩余|流量|到期|官网"

  # ================= 第二部分：自动测速组 (移至末尾，并在面板中隐藏) =================
  - name: 🇭🇰 香港自动
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    include-all: true
    filter: '(?i)🇭🇰|香港|(\b(HK|HongKong|Hong Kong)\b)'
    hidden: true

